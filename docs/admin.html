<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品管理 · 德国价格追踪</title><link rel="stylesheet" href="style.css"></head>
<body><main class="wrap"><header><div><div class="eyebrow">GERMANY PRICE TRACKER · V2</div><h1>商品管理</h1><p class="muted">最多 100 件商品 · 保存到 GitHub 后自动触发采集</p></div><a href="./">价格仪表盘 ↗</a></header>
<section class="panel"><div class="row"><strong id="who">正在检查登录状态…</strong><a id="login" href="/auth/login">GitHub 登录</a><a href="/auth/logout">退出登录</a></div><p class="hint" id="message"></p></section>
<section class="panel"><h2>添加 / 编辑商品</h2><form id="form"><input type="hidden" id="id"><label>商品名称（必须与三个平台的型号、颜色、规格一致）<input id="name" required maxlength="160" placeholder="例如 Huawei Watch Fit 4 Black"></label><label>MediaMarkt 商品链接<input id="mediamarkt" type="url" placeholder="https://www.mediamarkt.de/..."></label><label>Amazon.de 商品链接<input id="amazon" type="url" placeholder="https://www.amazon.de/dp/..."></label><label>OTTO.de 商品链接<input id="otto" type="url" placeholder="https://www.otto.de/..."></label><div class="row"><label>目标价格 (€)<input id="target" type="number" step="0.01" min="0" placeholder="可不填"></label><label class="check"><input id="enabled" type="checkbox" checked> 启用监控</label></div><div class="row"><button type="submit">添加 / 更新商品</button><button type="button" class="secondary" id="clear">清空表单</button></div></form></section>
<section class="panel"><div class="row"><h2>监控商品 <span id="count"></span></h2><button id="save">保存全部修改到 GitHub</button></div><div id="items"></div></section><footer>安全提示：管理员必须使用指定的 GitHub 账号登录。GitHub Token 只存放在 Cloudflare Worker Secrets 中。</footer></main>
<script>
const $=id=>document.getElementById(id);let products=[],sha='',csrf='';
const api=location.origin;
const note=(s,bad=false)=>{$('message').textContent=s;$('message').className=bad?'hint error':'hint'};
async function call(path,opt={}){const r=await fetch(api+path,{credentials:'include',cache:'no-store',...opt});const j=await r.json();if(!r.ok)throw Error(j.error||'HTTP '+r.status);return j}
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function reset(){$('form').reset();$('id').value='';$('enabled').checked=true}
function render(){ $('count').textContent=`(${products.length}/100)`;$('items').innerHTML=products.map((p,i)=>`<div class="item"><div><strong>${safe(p.name)}</strong><div class="muted small">${Object.entries(p.links||{}).filter(([k,v])=>v).map(([k])=>safe(k)).join(' · ')||'尚未配置链接'} · ${p.enabled===false?'暂停':'启用'}</div></div><div class="row"><button class="secondary" data-edit="${i}">编辑</button><button class="danger" data-remove="${i}">删除</button></div></div>`).join('')||'<p class="muted">尚无商品</p>'}
$('items').addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'),remove=e.target.closest('[data-remove]');if(edit){const p=products[+edit.dataset.edit];$('id').value=p.id;$('name').value=p.name;for(const s of ['mediamarkt','amazon','otto'])$(s).value=p.links?.[s]||'';$('target').value=p.target_price??'';$('enabled').checked=p.enabled!==false;window.scrollTo({top:0,behavior:'smooth'})}if(remove&&confirm('确定删除这件商品？')){products.splice(+remove.dataset.remove,1);render();note('尚未保存，请点击“保存全部修改到 GitHub”')}});
$('clear').onclick=reset;
$('form').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim();const id=$('id').value||'p-'+crypto.randomUUID().replace(/-/g,'').slice(0,20);const links={};for(const s of ['mediamarkt','amazon','otto'])links[s]=$(s).value.trim();if(!Object.values(links).some(Boolean)){note('至少填写一个商家链接',true);return}const p={id,name,links,enabled:$('enabled').checked,target_price:$('target').value?Number($('target').value):null};const i=products.findIndex(x=>x.id===id);if(i>=0)products[i]=p;else if(products.length<100)products.push(p);else{note('最多100件商品',true);return}render();reset();note('已修改本地列表，尚未保存到 GitHub')};
$('save').onclick=async()=>{try{if(!csrf)throw Error('请先登录');note('正在保存…');await call('/api/products',{method:'PUT',headers:{'content-type':'application/json','x-csrf-token':csrf},body:JSON.stringify({products,sha})});const r=await call('/api/products');sha=r.sha;products=r.products;render();note('已保存到 GitHub。自动采集稍后开始；请到 GitHub Actions 查看结果。')}catch(e){note('保存失败：'+e.message,true)}};
(async()=>{try{const me=await call('/api/me');csrf=me.csrf;$('who').textContent='已登录：'+me.login;const r=await call('/api/products');products=r.products;sha=r.sha;render();note('已加载 GitHub 最新商品配置')}catch(e){$('who').textContent='未登录';note(e.message,true)}})();
</script></body></html>
