<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>价格监控管理</title><style>body{font:16px system-ui;background:#f4f6fa;color:#1d2939;margin:0;padding:16px}main{max-width:900px;margin:auto}.card{background:white;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 2px 10px #0000000a}input{display:block;width:100%;box-sizing:border-box;padding:11px;margin:5px 0 13px;border:1px solid #b8c2d2;border-radius:8px}input[type=checkbox]{display:inline;width:auto}button,.btn{display:inline-block;background:#155eef;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;margin:4px;text-decoration:none}.secondary{background:#e5eaf2;color:#182230}.danger{background:#b42318}.muted{color:#667085}.item{border-bottom:1px solid #e6e9f0;padding:12px 0}label{font-size:14px}#app{display:none}</style><main><h1>德国商品价格监控 · 管理</h1><p><a id="dashboard" href="#">← 查看价格曲线</a></p><div class="card" id="login"><p>使用授权的 GitHub 账户登录后，可直接添加、编辑和保存商品。</p><a class="btn" id="loginbtn">GitHub 登录</a><p class="muted" id="loginmsg">正在检查登录状态…</p></div><div id="app"><div class="card"><b id="count"></b> <span class="muted" id="account"></span><button id="save">保存全部修改到 GitHub</button><a class="btn secondary" id="logout">退出登录</a><p id="msg" role="status"></p><div id="list"></div></div><div class="card"><h2 id="formtitle">添加商品</h2><form id="form"><label>商品名称</label><input id="name" maxlength="160" required><label>MediaMarkt 链接</label><input id="mediamarkt" type="url" placeholder="https://www.mediamarkt.de/..."><label>Amazon.de 链接</label><input id="amazon" type="url" placeholder="https://www.amazon.de/..."><label>OTTO.de 链接</label><input id="otto" type="url" placeholder="https://www.otto.de/..."><label>目标价格（€，可选）</label><input id="target" type="number" min="0" step="0.01"><label><input id="enabled" type="checkbox" checked> 启用监控</label><p><button type="submit">添加 / 更新商品</button><button class="secondary" id="reset" type="button">取消编辑</button></p></form></div></div></main><script src="worker-config.js"></script><script>
const api=location.origin;
const $=id=>document.getElementById(id);
$('dashboard').href=window.PRICE_TRACKER_PAGES||'#';
let products=[],sha='',csrf='',editing=-1;
const shops=['mediamarkt','amazon','otto'];
const notice=t=>$('msg').textContent=t;async function call(path,opts={}){const r=await fetch(api+path,{credentials:'include',...opts});const v=await r.json();if(!r.ok)throw Error(v.error||'HTTP '+r.status);return v}function render(){ $('count').textContent=`${products.length} / 100 件商品`;const list=$('list');list.replaceChildren();products.forEach((p,i)=>{const d=document.createElement('div');d.className='item';const strong=document.createElement('strong');strong.textContent=p.name;d.append(strong,document.createTextNode(' · '+shops.filter(s=>p.links?.[s]).length+' 个平台 · '+(p.enabled===false?'暂停':'启用')));for(const [title,fn,cl] of [['编辑',()=>fill(i),'secondary'],[p.enabled===false?'恢复':'暂停',()=>{p.enabled=p.enabled===false;render()},'secondary'],['删除',()=>{if(confirm('确认删除监控配置？历史记录不会删除。')){products.splice(i,1);reset();render()}},'danger']]){const b=document.createElement('button');b.textContent=title;b.className=cl;b.onclick=fn;d.append(b)}list.append(d)})}function reset(){editing=-1;HTMLFormElement.prototype.reset.call($('form'));$('formtitle').textContent='添加商品'}function fill(i){editing=i;const p=products[i];$('name').value=p.name;shops.forEach(s=>$(s).value=p.links?.[s]||'');$('target').value=p.target_price??'';$('enabled').checked=p.enabled!==false;$('formtitle').textContent='编辑商品';$('form').scrollIntoView({behavior:'smooth'})}function valid(s,url){if(!url)return true;try{const u=new URL(url);return u.protocol==='https:'&&(u.hostname===s+'.de'||u.hostname.endsWith('.'+s+'.de'))}catch{return false}}$('form').onsubmit=e=>{e.preventDefault();const links=Object.fromEntries(shops.map(s=>[s,$(s).value.trim()]));if(!Object.values(links).some(Boolean))return alert('至少填写一个平台链接');if(shops.some(s=>!valid(s,links[s])))return alert('请检查链接平台与 HTTPS');if(editing===-1&&products.length>=100)return alert('最多100件商品');const p={id:editing<0?'p-'+crypto.randomUUID().replaceAll('-','').slice(0,24):products[editing].id,name:$('name').value.trim(),links,enabled:$('enabled').checked,target_price:$('target').value===''?null:Number($('target').value)};if(editing<0)products.push(p);else products[editing]=p;reset();render();notice('修改尚未保存到云端，请点击“保存全部修改到 GitHub”。')};$('reset').onclick=reset;$('save').onclick=async()=>{try{notice('正在保存…');await call('/api/products',{method:'PUT',headers:{'content-type':'application/json','x-csrf-token':csrf},body:JSON.stringify({products,sha})});const v=await call('/api/products');sha=v.sha;products=v.products;render();notice('已保存到 GitHub。下一次抓取将使用新配置。')}catch(e){notice('保存失败：'+e.message+'。如果是版本冲突，请刷新页面后重试。')}};$('loginbtn').href=api+'/auth/login';$('logout').href=api+'/auth/logout';(async()=>{try{const me=await call('/api/me');csrf=me.csrf;$('account').textContent='已登录：'+me.login;const v=await call('/api/products');products=v.products;sha=v.sha;$('login').style.display='none';$('app').style.display='block';render()}catch(e){$('loginmsg').textContent=e.message==='not_authenticated'?'请点击 GitHub 登录。':'无法连接 Worker：'+e.message}})();
</script></html>
