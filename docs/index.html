<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>德国商品价格追踪</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script><style>body{font:16px system-ui;background:#f5f6f8;color:#17212e;margin:0;padding:20px}main{max-width:1100px;margin:auto}.card{background:white;padding:20px;margin:18px 0;border-radius:16px}select{padding:10px;border-radius:8px}.chart{height:400px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #eee}.muted{color:#667085}a{color:#175cd3}@media(max-width:600px){.chart{height:300px}}</style><main><h1>📉 德国三平台价格追踪</h1><p class="muted">MediaMarkt · Amazon.de · OTTO.de | 每小时尝试采集；失败不记为零 · <a href="https://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev/admin.html">管理商品</a></p><div class="card">商品：<select id="sel"></select><p id="checked" class="muted"></p><div id="shops"></div></div><div class="card"><h2>三平台价格历史曲线</h2><div style="display:flex;gap:8px;margin-bottom:12px"><button data-days="7">7天</button><button data-days="30">30天</button><button data-days="90">90天</button></div><div id="stats" class="muted"></div><div class="chart"><canvas id="chart"></canvas></div></div><div class="card"><a href="prices.csv" download>下载 CSV 历史数据</a><h2>最近采集记录</h2><table><thead><tr><th>时间</th><th>平台</th><th>价格</th></tr></thead><tbody id="records"></tbody></table></div></main><script>
let chart,st,rows=[],days=30;const shops=['mediamarkt','amazon','otto'],names=['MediaMarkt','Amazon.de','OTTO.de'],colors=['#ef4444','#f59e0b','#2563eb'];const fmt=t=>new Date(t).toLocaleString('de-DE',{timeZone:'Europe/Berlin',dateStyle:'short',timeStyle:'short'});function render(){const g=st.groups.find(x=>x.id===document.querySelector('#sel').value);if(!g)return;document.querySelector('#checked').textContent='最近检查：'+fmt(st.checked_at);const cutoff=Date.now()-days*86400000;const r=rows.filter(x=>x.id.startsWith(g.id+'__')&&Date.parse(x.time)>=cutoff);const panel=document.querySelector('#shops');panel.replaceChildren();shops.forEach((shop,i)=>{const p=st.products.find(x=>x.id===g.id+'__'+shop);const a=document.createElement('div');a.style.padding='10px 0';const link=document.createElement('a');link.textContent=names[i];if(g.links[shop]){link.href=g.links[shop];link.target='_blank';link.rel='noopener noreferrer'}const latest=r.filter(x=>x.id===g.id+'__'+shop).at(-1);a.append(link,document.createTextNode(' — '+(latest?latest.price.toFixed(2)+' €':'尚无价格')+' · '+(p?p.status==='ok'?'抓取成功':p.status==='error'?'抓取失败':'停用':'未配置链接')));panel.append(a)});const stats=document.querySelector('#stats');stats.replaceChildren();shops.forEach((shop,i)=>{const values=r.filter(x=>x.id===g.id+'__'+shop).map(x=>x.price);const line=document.createElement('p');if(values.length){const lo=Math.min(...values),hi=Math.max(...values),avg=values.reduce((a,b)=>a+b,0)/values.length;const change=values.at(-1)-values[0];line.textContent=`${names[i]}：最低 €${lo.toFixed(2)} · 最高 €${hi.toFixed(2)} · 平均 €${avg.toFixed(2)} · 涨跌 ${change>=0?'+':''}€${change.toFixed(2)} (${values[0]?(change/values[0]*100).toFixed(1):'0'}%)`;}else line.textContent=names[i]+'：所选时间段暂无数据';stats.append(line)});const times=[...new Set(r.map(x=>x.time))].sort();const datasets=shops.map((shop,i)=>{const lookup=new Map(r.filter(x=>x.id===g.id+'__'+shop).map(x=>[x.time,x.price]));return {label:names[i],data:times.map(t=>lookup.get(t)??null),borderColor:colors[i],backgroundColor:colors[i],spanGaps:true,tension:.1,pointRadius:times.length>100?0:2}});if(chart)chart.destroy();chart=new Chart(document.querySelector('#chart'),{type:'line',data:{labels:times.map(fmt),datasets},options:{responsive:true,maintainAspectRatio:false,scales:{x:{ticks:{maxTicksLimit:9}},y:{beginAtZero:false}}}});const body=document.querySelector('#records');body.replaceChildren();r.slice(-50).reverse().forEach(x=>{const tr=document.createElement('tr');[fmt(x.time),names[shops.indexOf(x.id.split('__').at(-1))]||x.id,x.price.toFixed(2)+' €'].forEach(t=>{const td=document.createElement('td');td.textContent=t;tr.append(td)});body.append(tr)})}
Promise.all([fetch('status.json?'+Date.now()).then(x=>x.json()),fetch('prices.csv?'+Date.now()).then(x=>x.text())]).then(([s,c])=>{st=s;rows=c.trim().split(/\r?\n/).slice(1).map(x=>{const a=x.split(',');return {id:a[0],time:a[1],price:Number(a[2])}}).filter(x=>x.id&&Number.isFinite(x.price));document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{days=Number(b.dataset.days);render()});const sel=document.querySelector('#sel');st.groups.forEach(g=>{const opt=document.createElement('option');opt.value=g.id;opt.textContent=g.name;sel.append(opt)});sel.onchange=render;render()}).catch(e=>document.querySelector('#checked').textContent='数据尚未生成，请先运行 GitHub Actions：'+e.message);
</script></html>
